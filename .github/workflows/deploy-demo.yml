name: CD Pipeline (Demo - mirrors RiskMapGenerator/deploy.yml)

# A demo that mirrors the EXACT STRUCTURE of rmg/RiskMapGenerator/.github/workflows/deploy.yml:
# same trigger type, same environment selection, same job/step order - with exactly one
# difference: it does NOT call or interact with real AWS. Every "login / build / push / restart"
# step here just echoes to the log to simulate the flow, so it's safe to demo to a client with no
# cloud account required.
#
# Mapping to the real pipeline:
#   - "Log in to the target infrastructure" <-> "Configure AWS credentials" (assume an IAM Role via OIDC)
#   - "Fetch reference data"                <-> "Sync tiles_data from S3"
#   - "Build & push (simulated)"            <-> building the Docker image + pushing to ECR
#   - "Restart the main service"            <-> force-new-deployment + waiting for ECS to stabilize
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to "deploy" to'
        type: choice
        options: [dev, prod] # adding a new environment: just add its name here
        required: true

concurrency:
  group: demo-deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  DATA_CACHE_VERSION: "1"

jobs:
  build-push:
    name: "1) Build & push (simulated)"
    runs-on: ubuntu-latest
    # Each environment (dev/prod) is its own GitHub Environment, and can hold a different secret -
    # in the real pipeline, this is where the AWS_ROLE secret points to the right AWS account
    # for that environment.
    environment: ${{ inputs.environment }}
    strategy:
      matrix:
        service: [gateway, worker, lambda]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Log in to the target infrastructure (simulated)"
        run: |
          echo "Logging in to environment '${{ inputs.environment }}' using the DEPLOY_TOKEN secret..."
          echo "(real pipeline: assumes an IAM Role on AWS via OIDC - the exact account for this environment)"
          if [ -z "${{ secrets.DEPLOY_TOKEN }}" ]; then
            echo "::notice::DEPLOY_TOKEN secret not set for environment '${{ inputs.environment }}' - that's fine, the demo continues anyway."
          fi

      - name: Cache reference data
        id: cache-data
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: reference-data
          key: reference-data-v${{ env.DATA_CACHE_VERSION }}

      - name: "Fetch reference data (simulated)"
        # Real pipeline: downloads ~440MB of map data from S3 (only when there's a cache miss).
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: |
          mkdir -p reference-data
          echo "Data fetched at $(date -u +%FT%TZ)" > reference-data/data.txt
          echo "Reference data fetched (simulated)."

      - name: "Build & push ${{ matrix.service }} (simulated)"
        run: |
          echo "Building the '${{ matrix.service }}' image for environment '${{ inputs.environment }}'..."
          sleep 2
          echo "Pushed '${{ matrix.service }}:latest' to the registry (simulated - nothing real was pushed)."

  restart-gateway:
    name: "2) Restart the main service (simulated)"
    needs: build-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: "Restart the main service (simulated)"
        run: |
          echo "Restarting the main service in environment '${{ inputs.environment }}'..."
          sleep 2
          echo "Service is stable on the new version."

      - name: Summary
        run: |
          {
            echo "### \"Deployed\" (demo) to \`${{ inputs.environment }}\`"
            echo ""
            echo "Simulated images built & pushed: gateway, worker, lambda."
            echo "- Main service \"restarted\" and stable (simulated)."
            echo ""
            echo "_Nothing real ran on any cloud - this pipeline only demonstrates the CI/CD structure._"
          } >> "$GITHUB_STEP_SUMMARY"
