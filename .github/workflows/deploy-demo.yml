name: CD Pipeline (Demo - giống cấu trúc RiskMapGenerator/deploy.yml)

# Bản demo mô phỏng ĐÚNG CẤU TRÚC của rmg/RiskMapGenerator/.github/workflows/deploy.yml:
# cùng kiểu trigger, cùng cách chọn môi trường, cùng thứ tự job/step - chỉ khác duy nhất 1 điều:
# KHÔNG gọi/tương tác với AWS thật nào. Mỗi bước "đăng nhập / build / push / restart" ở đây chỉ
# echo ra màn hình để mô phỏng, an toàn để demo cho khách hàng mà không cần tài khoản cloud nào.
#
# Đối chiếu với bản thật:
#   - "Đăng nhập vào hạ tầng đích"      <-> "Configure AWS credentials" (assume IAM Role qua OIDC)
#   - "Tải dữ liệu tham chiếu"          <-> "Sync tiles_data from S3"
#   - "Build & push (mô phỏng)"         <-> build Docker image + push lên ECR
#   - "Khởi động lại service chính"     <-> force-new-deployment + wait cho ECS ổn định
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Môi trường muốn "triển khai" tới'
        type: choice
        options: [dev, prod] # thêm môi trường mới: chỉ cần thêm tên vào đây
        required: true

concurrency:
  group: demo-deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  DATA_CACHE_VERSION: "1"

jobs:
  build-push:
    name: "1) Build & push (mô phỏng)"
    runs-on: ubuntu-latest
    # Mỗi môi trường (dev/prod) là 1 GitHub Environment riêng, có thể chứa secret khác nhau -
    # ở bản thật, đây là chỗ secret AWS_ROLE trỏ tới đúng tài khoản AWS của môi trường đó.
    environment: ${{ inputs.environment }}
    strategy:
      matrix:
        service: [gateway, worker, lambda]
    steps:
      - name: Lấy code về
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Đăng nhập vào hạ tầng đích (mô phỏng)"
        run: |
          echo "Đăng nhập vào môi trường '${{ inputs.environment }}' bằng secret DEPLOY_TOKEN..."
          echo "(bản thật: assume 1 IAM Role trên AWS qua OIDC - đúng account của môi trường này)"
          if [ -z "${{ secrets.DEPLOY_TOKEN }}" ]; then
            echo "::notice::Chưa cấu hình secret DEPLOY_TOKEN cho environment '${{ inputs.environment }}' - không sao, demo vẫn chạy tiếp."
          fi

      - name: Cache dữ liệu tham chiếu
        id: cache-data
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: reference-data
          key: reference-data-v${{ env.DATA_CACHE_VERSION }}

      - name: "Tải dữ liệu tham chiếu (mô phỏng)"
        # Bản thật: tải ~440MB dữ liệu bản đồ từ S3 (chỉ tải khi cache miss).
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: |
          mkdir -p reference-data
          echo "Dữ liệu tải lúc $(date -u +%FT%TZ)" > reference-data/data.txt
          echo "Đã tải xong dữ liệu tham chiếu (mô phỏng)."

      - name: "Build & push ${{ matrix.service }} (mô phỏng)"
        run: |
          echo "Đang build image '${{ matrix.service }}' cho môi trường '${{ inputs.environment }}'..."
          sleep 2
          echo "Đã push '${{ matrix.service }}:latest' lên registry (mô phỏng - không có gì thật được push)."

  restart-gateway:
    name: "2) Khởi động lại service chính (mô phỏng)"
    needs: build-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: "Khởi động lại service chính (mô phỏng)"
        run: |
          echo "Đang restart service chính trên môi trường '${{ inputs.environment }}'..."
          sleep 2
          echo "Service đã ổn định với phiên bản mới."

      - name: Tổng kết
        run: |
          {
            echo "### Đã \"triển khai\" (demo) tới \`${{ inputs.environment }}\`"
            echo ""
            echo "Image mô phỏng đã build & push: gateway, worker, lambda."
            echo "- Service chính đã \"restart\" và ổn định (mô phỏng)."
            echo ""
            echo "_Không có gì thật sự chạy trên cloud - toàn bộ pipeline này chỉ để demo cấu trúc CI/CD._"
          } >> "$GITHUB_STEP_SUMMARY"
