name: CI/CD Demo

# A minimal example illustrating the CI/CD concept:
#
# - CI (Continuous Integration): every time code changes (push or PR), the system AUTOMATICALLY
#   checks the code (runs tests) - nobody has to do it by hand.
#
# - CD (Continuous Deployment): if the check above PASSES, and the change has actually landed on
#   the main branch (not just a PR waiting for review), the system AUTOMATICALLY publishes the
#   new version to a real environment (here, a public website via GitHub Pages, for simplicity -
#   no cloud account needed) - nobody has to click "deploy" by hand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment to run at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: "1) CI - Automated code check"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Run tests
        run: node test.js

  deploy:
    name: "2) CD - Automatic deployment to production"
    needs: test
    # Only deploy once the change is really on main (push) - not for a PR still waiting for review.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Package the website (site/ folder)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "./site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
