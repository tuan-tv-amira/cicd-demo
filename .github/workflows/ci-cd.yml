name: CI/CD Demo

# Ví dụ tối giản minh hoạ khái niệm CI/CD:
#
# - CI (Continuous Integration - "tích hợp liên tục"): mỗi khi có thay đổi code (push hoặc mở PR),
#   hệ thống TỰ ĐỘNG kiểm tra code (chạy test) - không cần ai bấm tay.
#
# - CD (Continuous Deployment - "triển khai liên tục"): nếu kiểm tra ở trên PASS, và thay đổi đó
#   đã thật sự nằm trên nhánh main (không phải chỉ là 1 PR đang chờ duyệt), hệ thống TỰ ĐỘNG đưa
#   bản mới lên môi trường thật (ở đây là 1 trang web công khai, dùng GitHub Pages cho đơn giản,
#   không cần tài khoản cloud nào) - không cần ai bấm tay "deploy".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ cho phép 1 lượt deploy chạy tại 1 thời điểm.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: "1) CI - Kiểm tra code tự động"
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code về
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cài Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Chạy test
        run: node test.js

  deploy:
    name: "2) CD - Tự động triển khai lên production"
    needs: test
    # Chỉ deploy khi code đã thật sự vào main (push) - không deploy khi mới chỉ là PR đang chờ duyệt.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy code về
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Chuẩn bị GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Đóng gói trang web (thư mục site/)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "./site"

      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
